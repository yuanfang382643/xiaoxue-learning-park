<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小雪学习乐园 · 女声试听</title><style>body{background:#f5f7ee;color:#405b48;font:15px/1.8 'Microsoft YaHei',sans-serif;margin:0}main{max-width:800px;margin:auto;padding:30px 22px}button,select,input{font:inherit;border:1px solid #d9e4cf;border-radius:12px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active{background:#638b70;color:white}.filters{display:flex;gap:10px;flex-wrap:wrap}.clip{background:white;border-radius:18px;padding:18px;margin:15px 0}.clip p{margin:7px 0 12px}audio{width:100%}small{color:#93a087}.notice{background:#f9efd5;border-radius:14px;padding:16px}.status{font-size:12px;color:#b69255}.page{display:flex;gap:15px;align-items:center;margin:22px 0}h1{font-size:27px}a{color:#618d70}</style><main><small>供家长与教学审核人员使用</small><h1>听清楚，再交给孩子</h1><p>使用 Kokoro 中文模型的成年女声 zf_001，语速较慢。本页可对照文字试听；生成文件不等于发音已审核合格。</p><p class="notice">重点检查拼音单音、四声、轻声、多音字和数学运算。这里只记录你的本机听审意见，不会自动把素材标为正式合格。</p><div class="filters"><select id="subject" aria-label="筛选配音"><option value="common">欢迎与奖励</option><option value="practice">练字与表达引导</option><option value="pinyin-">拼音</option><option value="math-">数学</option><option value="reading-">阅读</option><option value="writing-">练字</option><option value="speaking-">表达</option><option value="card">汉字卡片</option><option value="all">全部</option></select><input id="search" placeholder="搜索朗读文字" aria-label="搜索文字"></div><p id="summary">正在读取配音清单…</p><div id="clips"></div><div class="page"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><button id="export">导出听审意见</button></div><a href="./guide.html">返回图示指南</a></main><script>
let entries=[],page=0;const notes=JSON.parse(localStorage.getItem('xiaoxue-audio-notes')||'{}');const $=id=>document.getElementById(id);function selected(){return entries.filter(e=>($('subject').value==='all'||e.lessons.some(l=>l.startsWith($('subject').value)))&&e.text.includes($('search').value.trim()));}function render(){const list=selected();$('clips').replaceChildren();$('summary').textContent='匹配 '+list.length+' 条配音；正式教学听审状态：待完成。';$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(list.length/8));$('prev').disabled=page===0;$('next').disabled=(page+1)*8>=list.length;for(const entry of list.slice(page*8,page*8+8)){const box=document.createElement('section');box.className='clip';const small=document.createElement('small');small.textContent=entry.lessons.slice(0,3).join(' · ');const text=document.createElement('p');text.textContent=entry.text;const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src='./audio/'+entry.key+'.mp3';audio.playbackRate=.96;audio.volume=.9;audio.onplay=()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause();});const status=document.createElement('p');status.className='status';audio.onerror=()=>{status.textContent='文件尚未生成或暂时无法播放，请稍后再试。';};const select=document.createElement('select');select.setAttribute('aria-label','这条配音的听审意见');for(const [value,label] of [['','尚未听审'],['clear','个人试听：清楚'],['retry','需要重新制作']]){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option);}select.value=notes[entry.key]||'';select.onchange=()=>{notes[entry.key]=select.value;localStorage.setItem('xiaoxue-audio-notes',JSON.stringify(notes));};box.append(small,text,audio,status,select);$('clips').append(box);}}
$('subject').onchange=$('search').oninput=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({date:new Date().toISOString(),notes},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='小雪乐园-个人听审意见.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};fetch('./audio/manifest.json').then(r=>r.json()).then(data=>{entries=data;render();}).catch(()=>{$('summary').textContent='暂时无法读取配音清单。请通过应用预览地址打开本页。';});
</script></html>
